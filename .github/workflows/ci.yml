name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  functions:
    name: Functions
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test Firestore and Storage rules
        run: npm run test:rules:emulators

      - name: Test HTTP and callable endpoints
        run: npm run test:integration:emulators
